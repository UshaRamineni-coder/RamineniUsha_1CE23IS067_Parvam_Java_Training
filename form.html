<body>
    <p><h1><i>FORM WITH TEXT AND EMAIL INPUT</i></h1></p>
    <form action="/submit" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required/><br><br />
 
     <label for="email">Email:</label>
    <input type="email" id="email" name="email" required/><br><br />

    <input type="submit" value="submit" /> 

    <h2>Select Gender</h2>
    <form action="/submit" method="POST"></form>

    <label for="male">Male</label>
    <input type="Radio" id="male" name="gender" value="male"/><br><br />

    <label for="female">Female</label>
    <input type="Radio" id="female" name="gender" value="female"/><br><br />

    <input type="submit" value="submit" /> 

    <h2>Terms and Conditions</h2>
    <form action="/submit" method="POST">
    <LABEL><input type="checkbox" name="terms" required/>I agree terms and conditions</LABEL>
    ><br><br />

    <input type="submit" value="submit" /> 
    

     <h2>Select a country</h2>

    <option value="CSE">CSE</option>
    <option value="ECE">ECE</option><br><br />


    <input type="submit" value="submit" /> 

    <h2>logim form</h2>

    <input type="text" id="username" name="username" required/><br><br />

     <label for="password">Password:</label>

     <input type="submit" value="login" /> 


    </form>
