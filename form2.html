<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

     <p><h1><i>STUDENT FROM</i></h1></p>
    <form action="/submit" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required/><br><br />
 
     <label for="email">Email:</label>
    <input type="email" id="email" name="email" required/><br><br />

      <label for="usn">USN:</label>
    <input type="usn" id="usn" name="usn" required/><br><br />

    <h2>Select Gender</h2>
    <form action="/submit" method="POST"></form>

    <label for="male">Male</label>
    <input type="Radio" id="male" name="gender" value="male"/><br><br />

    <label for="female">Female</label>
    <input type="Radio" id="female" name="gender" value="female"/><br><br />
    
     <h2>Select the branch</h2>
    <label for="branches">branches:</label>
    <select id="branches" name="branches">
    <option value="ISE">ISE</option>
    <option value="CSE">CSE</option>
    <option value="ECE">ECE</option><br><br />

    


</form>
</body>
</html>
